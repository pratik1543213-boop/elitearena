<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register your team for the Valorant Pro Circuit at Elite Arena - Competitive 5v5 tactical gameplay tournaments.">
  <title>Register — Valorant | Elite Arena</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-container">
      <a href="index.html" class="brand-logo"><img src="../images/elite%20arena.jpeg" alt="Elite Arena logo">Elite Arena</a>
      <input type="checkbox" id="nav-toggle-valorant" class="nav-toggle" aria-label="Toggle navigation">
      <label for="nav-toggle-valorant" class="nav-toggle-label">
        <span></span>
      </label>
        <a href="index.html">Home</a>
        <a href="tournaments.html">Tournaments</a>
        <a href="scores.html">Live Scores</a>
        <a href="schedule.html">Schedule</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="nav-actions">
        <a href="login.html" class="button button-secondary">Login</a>
        <a href="register.html" class="button button-primary">Register</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <img src="../images/team-banner.svg" alt="Register your team" class="register-banner">
      <div class="section-header">
        <h2>Register — Valorant Pro Circuit</h2>
      </div>

      <form class="contact-form" action="registration-success.html" method="get">
        <label for="team-name">Team Name</label>
        <input type="text" id="team-name" name="team-name" placeholder="Your team name" required>

        <label for="captain-name">Captain Name</label>
        <input type="text" id="captain-name" name="captain-name" placeholder="Team captain name" required>

        <label for="email">Contact Email</label>
        <input type="email" id="email" name="email" placeholder="captain@example.com" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+977 98xxxxxxx" required>

        <label for="game-title">Game</label>
        <input type="text" id="game-title" name="game-title" value="Valorant" readonly>

        <label for="team-count">Team Size</label>
        <input type="number" id="team-count" name="team-count" min="1" max="10" value="5" required>

        <label for="notes">Additional Notes</label>
        <textarea id="notes" name="notes" rows="4" placeholder="Any extra details"></textarea>

        <button type="submit" class="button button-primary">Submit Registration</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>© 2026 Elite Arena Esports. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
